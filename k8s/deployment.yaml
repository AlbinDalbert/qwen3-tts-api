apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-tts-api-caladan
  namespace: sietch-sentia
  labels:
    app: qwen3-tts-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-tts-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: qwen3-tts-api
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: caladan
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/albindalbert/qwen3-tts-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - configMapRef:
                name: qwen3-tts-api-config
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: reference-audio
              mountPath: /reference-audio
          resources:
            requests:
              cpu: "1"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: model-cache
          hostPath:
            path: /var/lib/qwen3-tts-models
            type: DirectoryOrCreate
        - name: reference-audio
          persistentVolumeClaim:
            claimName: qwen3-tts-reference-audio
